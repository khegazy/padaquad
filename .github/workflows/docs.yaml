name: docs

# Build the documentation on every pull request and push to main (warnings fail
# the build), and publish it to GitHub Pages when a release is published or on
# a manual run. Publishing needs the repository's Pages source set to
# "GitHub Actions" (Settings -> Pages).
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only torch keeps the install small; the docs build hides GPUs anyway.
      - name: Install packages
        run: |
          pip install uv
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r tests/requirements.txt ".[docs]"

      - name: Build the site (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck

      - name: Upload the site
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
