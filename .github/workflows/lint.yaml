name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check --output-format=github padaquad/

      - name: Ruff format check
        run: ruff format --check padaquad/

  numpydoc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install numpydoc
        run: pip install "numpydoc>=1.11"

      # Reads the source files; it does not import padaquad, so torch is not needed.
      - name: Docstring format (configuration in pyproject.toml)
        run: numpydoc lint $(git ls-files 'padaquad/*.py')
