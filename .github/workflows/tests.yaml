name: tests
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-base:
    runs-on: ubuntu-latest
    # id-token: the Codecov upload authenticates with GitHub's OIDC identity, so
    # no Codecov token is stored anywhere.
    permissions:
      contents: read
      id-token: write
    env:
      # "true" unless this is a PR from a fork (see the Codecov upload step).
      NOT_FORK: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pip packages
        run: |
          pip install uv
          uv pip install --system -r tests/requirements.txt .[dev]

      # Runs here, not in lint.yaml: mypy needs torch installed, or every tensor
      # type silently becomes Any (ignore_missing_imports = true).
      - name: Type check with mypy
        run: mypy padaquad/

      # padaquad is installed non-editable above, as users install it; the
      # coverage settings in pyproject.toml measure that installed copy.
      - name: Run tests with pytest
        run: pytest --cov --cov-report=xml

      # OIDC for pushes and same-repository PRs. A PR from a fork cannot get an
      # OIDC identity; Codecov accepts it without a token, and its failure does
      # not fail the contributor's CI (the upload after merging to main still does).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: ${{ env.NOT_FORK }}
          fail_ci_if_error: ${{ env.NOT_FORK }}
