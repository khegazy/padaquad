[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "padaquad"
description = "PyTorch library for parallelized adaptive numerical quadrature with full autograd support."
version = "1.3.0"
readme = "README.md"
license = "CC-BY-4.0"
authors = [{ name = "Kareem Hegazy", email = "khegazy@berkeley.edu" }]
keywords = ["path integral", "torch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: Unix",
  "Operating System :: MacOS",
]
requires-python = ">=3.11"
# Runtime dependencies for adaptive quadrature only. torchdiffeq is no longer
# a runtime dep (the serial-solver wrapper around it was removed in Phase 3.1
# of the quadrature alignment plan); it remains a dev/extras dependency for
# the speed-test example that benchmarks against torchdiffeq directly.
# scipy is used by the test suite (cross-validation against
# scipy.integrate.quad) but is also needed at runtime by future tanh-sinh
# support, so it lives here too. The padaquad package itself no longer imports
# numpy (the tests and scipy do).
# torch>=2.4: first release with the top-level torch.OutOfMemoryError used by
# the out-of-memory handling (PyTorch v2.4.0 release notes, #121702). Only
# torch 2.8 has been tested; CI installs the latest torch.
dependencies = ["numpy", "torch>=2.4", "scipy", "einops", "psutil"]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=3.10.0",
  "mypy~=2.1.0",
  "pre-commit",
  "ruff>=0.4.0",
  "typos",
  # torchdiffeq is needed for the speed-test benchmark in
  # examples/speed_test/torchdiffeq_comparison.py. Not used by the library.
  "torchdiffeq",
]
docs = [
  # The combination the documentation is built and tested with.
  "sphinx>=9.1",
  "numpydoc>=1.11",
  "myst-parser>=5.1",
  "sphinx-gallery>=0.22",
  "pydata-sphinx-theme>=0.24",
  "sphinx-design>=0.6",
  "sphinx-copybutton>=0.5",
  "sphinxcontrib-bibtex>=2.6",
]

[project.urls]
repository = "https://github.com/khegazy/padaquad"
documentation = "https://khegazy.github.io/padaquad/"
changelog = "https://github.com/khegazy/padaquad/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
padaquad = ["py.typed"]

[tool.pyright]
include = ["padaquad"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
minversion = "6.0"
# --doctest-modules runs the Examples sections of the docstrings in padaquad/.
addopts = ["-p no:warnings", "--import-mode=importlib", "--doctest-modules"]
xfail_strict = true
log_cli_level = "warn"
pythonpath = "padaquad"
testpaths = ["tests", "padaquad"]
markers = [
  "tier1: must-have correctness tests for the split integration paths",
  "tier2: high-value edge-case and shape-variation tests",
  "tier3: polish, fuzz, and gradient-behavior tests",
]

[tool.coverage.run]
source = ["padaquad"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "except ImportError",
]

[tool.ruff]
line-length = 88
src = ["padaquad"]
extend-include = ["*.ipynb"]
exclude = ["examples/pode/**"]

[tool.ruff.lint]
select = [
  "A",      # flake8-builtins
  "D",      # pydocstyle (NumPy convention, see pydocstyle.convention below)
  "ARG",    # flake8-unused-arguments
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "DTZ",    # flake8-datetimez
  "E",      # pycodestyle error
  "EXE",    # flake8-executable
  "F",      # pyflakes
  "FA",     # flake8-future-annotations
  "FLY",    # flynt
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "INT",    # flake8-gettext
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "NPY",    # numpy-specific rules
  "PD",     # pandas-vet
  "PERF",   # perflint
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific rules
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T20",    # flake8-print
  "TCH",    # flake8-type-checking
  "TID",    # flake8-tidy-imports
  "ASYNC1", # flake8-trio (renamed from TRIO)
  "UP",     # pyupgrade
  "W",      # pycodestyle warning
  "YTT",    # flake8-2020
]
ignore = [
  "E501",     # Line too long
  "ISC001",   # single-line-implicit-string-concatenation
  "PERF203",  # try-except-in-loop
  "PLR",      # Design related pylint codes

  "PT011",    # pytest.raises
  "PT012",    # pytest.raises
  "RET505",   # Unnecessary `elif` after `return`
]
unfixable = [
  "T20",  # Removes print statements
  "F841", # Removes unused variables
]
pydocstyle.convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["padaquad"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["ANN", "ARG", "D", "E402", "PTH", "S101"]
# Gallery scripts open with a title and underline, the format sphinx-gallery
# needs, which the summary-line rules D205/D400/D415 do not allow.
"examples/**" = ["T201", "D205", "D400", "D415"]
"docs/conf.py" = ["INP001", "ERA001"]
"docs/_ext/**" = ["INP001"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.docformatter]
pre-summary-newline = true
black = true

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
# Every function is annotated and every body is checked; enforced in CI
# (.github/workflows/tests.yaml), which installs torch so its types are real.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.numpydoc_validation]
# Every numpydoc check except these three: a "See Also" section (SA01), an
# Examples section (EX01; required only for the main public objects, which have
# one) and an extended summary (ES01) are not required.
checks = ["all", "SA01", "EX01", "ES01"]
# These classes document their constructor options in __init__'s docstring
# (checked on its own), so the class docstrings have no Parameters section.
exclude = [
  '\.(SolverBase|AdaptiveQuadrature|DistributedEnvironment|MethodClass|UniformMethodClass|VariableMethodClass|UniformAdaptiveQuadrature|VariableAdaptiveQuadrature)$',
]
